<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firma Lighter</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --txt:#e8ecf1; --mut:#8b95a3; --acc:#2dd4a7; --err:#ff6b6b; --brd:#2a303a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui,-apple-system,sans-serif; padding:16px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p { color:var(--mut); margin:6px 0 14px; }
  .card { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:14px; margin:12px 0; }
  pre { background:#0b0d11; padding:10px; border-radius:8px; white-space:pre-wrap; word-break:break-all; font-size:13px; margin:0; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--acc); color:#06231b; margin-top:12px; }
  button:disabled { opacity:.4; }
  .log div { font-size:14px; margin:4px 0; word-break:break-all; }
  .ok { color:var(--acc); } .err { color:var(--err); }
  #sig { margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>Autorizar clave de API en Lighter</h1>
  <p>Tu wallet va a firmar este mensaje (no es una transacción, no cuesta gas). Autoriza una clave que puede operar tu cuenta de Lighter; no puede transferir a otras cuentas. Vence a los 10 minutos.</p>
  <div class="card"><pre id="msg">(sin mensaje)</pre></div>
  <div class="card">
    <button id="btn" disabled>Firmar con mi wallet</button>
    <div class="log" id="log"></div>
    <div id="res" hidden>
      <p>Copia esta firma y pégala en el chat con Claude:</p>
      <pre id="sig"></pre>
      <button id="copiar">Copiar firma</button>
    </div>
  </div>
</main>
<script>
const $log = document.getElementById("log");
function log(t, cls) { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; $log.appendChild(d); }

// Trust Wallet firma pero no devuelve la firma a la pagina (28-oct): eth_requestAccounts si vuelve, las
// firmas no. Todo lo que llega del proveedor queda en pantalla, una firma vista en una respuesta cruda
// se toma aunque el canal normal no la entregue, y los intentos rotan entre proveedores y vias.
window.addEventListener("error", e => log("Error de la página: " + e.message, "err"));
window.addEventListener("unhandledrejection", e => log("Error sin capturar: " + ((e.reason && e.reason.message) || e.reason), "err"));
log("Página actualizada el 28-oct, diagnóstico (intentos con tope de 45 s).");
let avisar = null;
function revisar(origen, datos) {
  let s; try { s = typeof datos === "string" ? datos : JSON.stringify(datos); } catch { return; }
  if (!s || s.length < 3) return;
  log(`← ${origen}: ${s.slice(0, 300)}`);
  const m = s.match(/0x[0-9a-fA-F]{130}(?![0-9a-fA-F])/);
  if (m && avisar) avisar(m[0]);
}
window.addEventListener("message", e => revisar("mensaje", e.data));
function espiar(p, nombre) {
  if (p.__espiado) return; p.__espiado = true;
  const marcas = ["isTrust", "isTrustWallet", "isMetaMask", "isCoinbaseWallet", "isOkxWallet"].filter(k => p[k]);
  log(`Proveedor ${nombre}: ${marcas.join(", ") || "sin marcas"}`);
  for (const k of ["sendResponse", "sendError", "_handleResponse", "emit"]) {
    const f = p[k]; if (typeof f !== "function") continue;
    p[k] = function (...a) { revisar(nombre + "." + k, a); return f.apply(this, a); };
  }
}
function vias(eth) {
  const lista = [], vistos = new Set();
  for (const [p, nombre] of [[eth, "ethereum"], [window.trustwallet && window.trustwallet.ethereum, "trustwallet.ethereum"], [window.trustwallet, "trustwallet"]]) {
    if (!p || vistos.has(p) || typeof p.request !== "function") continue;
    vistos.add(p); espiar(p, nombre);
    lista.push({ p, nombre, antigua: false });
    if (typeof (p.sendAsync || p.send) === "function") lista.push({ p, nombre, antigua: true });
  }
  return lista;
}
let intento = 0;
async function firmar(eth, method, params) {
  const lista = vias(eth), v = lista[intento % lista.length];
  intento++;
  log(`Pidiendo la firma (intento ${intento}: ${v.nombre}${v.antigua ? ", sendAsync" : ", request"})…`);
  const pedir = v.antigua
    ? new Promise((ok, mal) => (v.p.sendAsync || v.p.send).call(v.p, { jsonrpc: "2.0", id: Date.now(), method, params },
        (err, res) => { revisar("callback", res || err); err ? mal(err) : res && res.error ? mal(res.error) : ok(res && res.result); }))
    : v.p.request({ method, params });
  const capturada = new Promise(ok => { avisar = ok; });
  let reloj;
  const tope = new Promise((_, mal) => { reloj = setTimeout(() => mal(new Error(
    `la wallet no devolvió la firma en 45 s. Toca el botón de nuevo: el siguiente intento usa otra vía (${lista.length} en total).`)), 45000); });
  try {
    const r = await Promise.race([pedir, capturada, tope]);
    log("La wallet respondió.", "ok");
    return typeof r === "string" ? r : r && typeof r.result === "string" ? r.result : JSON.stringify(r);
  } finally { clearTimeout(reloj); avisar = null; }
}

// El mensaje llega en el fragmento (#m=base64url), que el navegador no envía al servidor.
let mensaje = null;
try {
  const m = new URLSearchParams(location.hash.slice(1)).get("m");
  if (m) {
    const b64 = m.replace(/-/g, "+").replace(/_/g, "/");
    mensaje = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  }
} catch (e) { log("Link inválido: " + e.message, "err"); }

if (mensaje && mensaje.startsWith("Register Lighter Account")) {
  document.getElementById("msg").textContent = mensaje;
  document.getElementById("btn").disabled = false;
} else if (mensaje) {
  log("El mensaje no es un registro de clave de Lighter. No lo firmes.", "err");
}

document.getElementById("btn").onclick = async () => {
  const btn = document.getElementById("btn"); btn.disabled = true;
  try {
    const eth = window.ethereum || window.trustwallet || window.okxwallet;
    if (!eth) throw new Error("No hay wallet en este navegador. Abre esta página desde el navegador de tu app de wallet.");
    const [direccion] = await eth.request({ method: "eth_requestAccounts" });
    log("Wallet: " + direccion);
    // Texto plano: la wallet lo codifica igual (EIP-191) y con hex Trust Wallet se colgo el 28-oct.
    const firma = await firmar(eth, "personal_sign", [mensaje, direccion]);
    log("Firmado.", "ok");
    document.getElementById("sig").textContent = firma;
    document.getElementById("res").hidden = false;
  } catch (e) {
    log("Error: " + (e.message || e), "err");
    btn.disabled = false;
  }
};

document.getElementById("copiar").onclick = async (e) => {
  try { await navigator.clipboard.writeText(document.getElementById("sig").textContent); e.target.textContent = "Copiado"; }
  catch { e.target.textContent = "Mantén presionado el texto para copiar"; }
};
</script>
</body>
</html>
